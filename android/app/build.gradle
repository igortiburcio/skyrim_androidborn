apply plugin: 'com.android.application'

// -Pdual=true builds "Skyrim Dual" (com.tj.skyrim.dual): the HUD and
// favourites go to the second display. It installs next to the normal app;
// the native code is the same, so both builds share the CMake outputs.
def dual = project.hasProperty('dual') && project.property('dual') == 'true'

// Release signing key, kept outside the repository (see README "Signing").
// android/keystore.properties is a local symlink to the real file; without it
// the release build produces an unsigned APK and tools/build_release.sh stops.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile'] != null

android {
    namespace "com.tj.skyrim"
    compileSdkVersion 34
    ndkVersion project.hasProperty('ndkVersion') ? project.property('ndkVersion') : null
    defaultConfig {
        applicationId dual ? "com.tj.skyrim.dual" : "com.tj.skyrim"
        resValue "string", "app_name", dual ? "Skyrim Androidborn Dual" : "Skyrim Androidborn"
        buildConfigField "boolean", "DUAL", dual ? "true" : "false"
        minSdkVersion 28
        targetSdkVersion 29  // legacy storage: plain file access with the normal storage prompt
        versionCode 1000
        versionName dual ? "1.0.0-dual" : "1.0.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-28"
                abiFilters 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // The recompiled game is large; debug builds would be unusably slow.
        debug {
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
            debuggable true
            jniDebuggable false
        }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
    lint { abortOnError false }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':steam')
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
