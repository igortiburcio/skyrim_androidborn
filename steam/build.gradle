// Pure-Java Steam client protocol (WebSocket CM, QR auth, logon, depot
// downloads). Kept out of the Android sources so it can be unit-tested on the
// JVM and so the LGPL boundary is explicit. See NOTICE and README.md.
apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.tukaani:xz:1.9'
    implementation 'io.airlift:aircompressor:0.27'
    testImplementation 'junit:junit:4.13.2'
}
